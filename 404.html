<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Domínio</title>
<style>body{background:#0A0B0D;color:#ECE9E1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}a{color:#C6A15E}</style>
</head>
<body>
<div>
  <p>Esta página não existe mais.</p>
  <p><a id="home" href="/">Ir para o Domínio</a></p>
</div>
<script>
/* A raiz do projeto é o primeiro segmento do caminho (ex.: /Dominio/).
   Sem laço: se já estamos nela, apenas mostramos o link. */
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var root = seg.length ? '/' + seg[0] + '/' : '/';
  document.getElementById('home').href = root;
  if (location.pathname !== root) location.replace(root);
})();
</script>
</body>
</html>
