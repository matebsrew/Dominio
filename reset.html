<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Resetando Treino V4</title><style>body{margin:0;background:#0b1220;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}.box{max-width:420px;background:#121b2d;border:1px solid #26344d;border-radius:18px;padding:24px}.muted{color:#98a2b3}</style></head><body><div class="box"><h2>Corrigindo o app…</h2><p class="muted">Limpando a versão antiga e recarregando sem cache.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches'in window){const keys=await caches.keys();for(const k of keys)await caches.delete(k)}}catch(e){}location.replace('./?v=12&reset='+Date.now())})()</script></body></html>
